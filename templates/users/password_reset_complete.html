{% extends "users/basic.html" %}
{% block title %}Password Reset Complete | BookMySeat{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row">
    <div class="col-md-6 mx-auto">
      <div class="card shadow border-0 rounded-lg text-center p-4">
        <div class="card-body py-4">
          <i class="fas fa-check-circle fa-4x text-success mb-3"></i>
          <h3 class="font-weight-bold text-dark mb-2">Password Reset Complete</h3>
          <p class="text-muted mb-4" style="font-size:0.95rem;">
            Your password has been successfully reset! You can now log in to your account with your new password.
          </p>
          <a href="{% url 'login' %}" class="btn btn-primary font-weight-bold px-4 py-2" style="border-radius:20px;">
            <i class="fas fa-sign-in-alt mr-2"></i> Log In Now
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
